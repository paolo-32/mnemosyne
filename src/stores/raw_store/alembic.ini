[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; overridden at runtime by env.py via MNEMOSYNE_RAW_STORE_DB env var;
; this default is only used for local `alembic` CLI invocations run
; directly from this directory.
sqlalchemy.url = sqlite:///raw_store.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
